<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="glowBlue5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad5)" stroke="#1e293b" stroke-width="1.5" />
  
  <rect x="24" y="20" width="210" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="34" y="38" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">DOCKER ENGINE ARCHITECTURE</text>
  <text x="244" y="38" fill="#64748b" font-family="sans-serif" font-size="12">Namespaces · cgroups · Overlay2 Storage · Bridge</text>

  <!-- Main Linux Host Container -->
  <g transform="translate(30, 65)">
    <rect width="740" height="245" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">🐧 Linux Server Host (Ubuntu 24.04 LTS)</text>
    <text x="540" y="26" fill="#64748b" font-family="monospace" font-size="11">Shared Linux Kernel 6.8</text>

    <!-- Docker Daemon Box -->
    <rect x="20" y="42" width="220" height="185" rx="10" fill="url(#dockerGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowBlue5)" />
    <text x="35" y="70" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">🐳 Docker Daemon</text>
    <text x="35" y="88" fill="#bae6fd" font-family="monospace" font-size="11">dockerd (/var/run/docker.sock)</text>

    <rect x="35" y="105" width="190" height="32" rx="6" fill="#0c4a6e" />
    <text x="45" y="125" fill="#e0f2fe" font-family="monospace" font-size="10">docker0 Bridge: 172.17.0.1</text>

    <rect x="35" y="145" width="190" height="32" rx="6" fill="#0c4a6e" />
    <text x="45" y="165" fill="#e0f2fe" font-family="monospace" font-size="10">Storage Driver: overlay2</text>

    <rect x="35" y="185" width="190" height="30" rx="6" fill="#0c4a6e" />
    <text x="45" y="204" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Kernel Isolation: cgroups</text>

    <!-- Container 1: Web Nginx -->
    <g transform="translate(265, 42)">
      <rect width="145" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#10b981" fill-opacity="0.25" />
      <text x="27" y="34" fill="#34d399" font-size="16" text-anchor="middle">🌐</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">web-app</text>
      <text x="50" y="42" fill="#34d399" font-family="monospace" font-size="10">nginx:alpine</text>

      <rect x="12" y="60" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">Port: -p 80:80</text>

      <rect x="12" y="98" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">IP: 172.17.0.2</text>

      <rect x="12" y="136" width="121" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">Rootless Filesystem</text>
      <text x="18" y="165" fill="#10b981" font-family="monospace" font-size="9">Running OK</text>
    </g>

    <!-- Container 2: Node.js API -->
    <g transform="translate(425, 42)">
      <rect width="145" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#6366f1" fill-opacity="0.25" />
      <text x="27" y="34" fill="#818cf8" font-size="16" text-anchor="middle">📦</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">api-service</text>
      <text x="50" y="42" fill="#818cf8" font-family="monospace" font-size="10">node:20-slim</text>

      <rect x="12" y="60" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">Port: -p 3000:3000</text>

      <rect x="12" y="98" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">IP: 172.17.0.3</text>

      <rect x="12" y="136" width="121" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">Restart Policy</text>
      <text x="18" y="165" fill="#818cf8" font-family="monospace" font-size="9">always</text>
    </g>

    <!-- Container 3: Persistent Database -->
    <g transform="translate(585, 42)">
      <rect width="140" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#f59e0b" fill-opacity="0.25" />
      <text x="27" y="34" fill="#fbbf24" font-size="16" text-anchor="middle">🗄️</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">db-server</text>
      <text x="50" y="42" fill="#fbbf24" font-family="monospace" font-size="10">mariadb:11</text>

      <rect x="12" y="60" width="116" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">Port: 3306 TCP</text>

      <rect x="12" y="98" width="116" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">IP: 172.17.0.4</text>

      <rect x="12" y="136" width="116" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">Named Volume</text>
      <text x="18" y="165" fill="#fbbf24" font-family="monospace" font-size="9">/var/lib/mysql</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(140, 325)">
    <circle cx="10" cy="10" r="5" fill="#38bdf8" />
    <text x="22" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Docker Bridge Network</text>

    <circle cx="210" cy="10" r="5" fill="#34d399" />
    <text x="222" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Host Port Bindings (-p)</text>

    <circle cx="410" cy="10" r="5" fill="#fbbf24" />
    <text x="422" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Persistent Host Volume Mounts (-v)</text>
  </g>
</svg>
