<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="backupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glowGreen6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#34d399" flood-opacity="0.3" />
    </filter>
    <marker id="arrowGreen6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowCyan6" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad6)" stroke="#1e293b" stroke-width="1.5" />

  <rect x="24" y="20" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="34" y="38" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">KEEPALIVED &amp; VRRP FAILOVER</text>
  <text x="254" y="38" fill="#64748b" font-family="sans-serif" font-size="12">Floating VIP · Active-Passive High Availability</text>

  <!-- Top Floating VIP Banner -->
  <g transform="translate(230, 60)">
    <rect width="340" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="28" cy="26" r="8" fill="#38bdf8" fill-opacity="0.25" />
    <circle cx="28" cy="26" r="4" fill="#38bdf8" />
    <text x="48" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">Virtual Floating IP (VIP):</text>
    <text x="48" y="42" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="700">192.168.1.100</text>
    <rect x="240" y="14" width="85" height="24" rx="6" fill="#0369a1" />
    <text x="282" y="30" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE VIP</text>
  </g>

  <!-- Left Node: MASTER Server -->
  <g transform="translate(80, 140)" filter="url(#glowGreen6)">
    <rect width="280" height="150" rx="12" fill="url(#masterGrad)" stroke="#34d399" stroke-width="2" />
    <text x="20" y="32" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">🔄 Server 1: MASTER</text>
    <text x="20" y="50" fill="#a7f3d0" font-family="monospace" font-size="12">IP: 192.168.1.11 · priority 101</text>

    <rect x="18" y="65" width="244" height="34" rx="6" fill="#042f2e" stroke="#059669" />
    <text x="28" y="86" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">✓ Owns Floating VIP 192.168.1.100</text>

    <rect x="18" y="106" width="244" height="30" rx="6" fill="#042f2e" stroke="#059669" />
    <text x="28" y="125" fill="#a7f3d0" font-family="monospace" font-size="10">VRRP Multicast: 224.0.0.18 (Heartbeat)</text>
  </g>

  <!-- Right Node: BACKUP Server -->
  <g transform="translate(440, 140)">
    <rect width="280" height="150" rx="12" fill="url(#backupGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="20" y="32" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">⏳ Server 2: BACKUP</text>
    <text x="20" y="50" fill="#94a3b8" font-family="monospace" font-size="12">IP: 192.168.1.12 · priority 100</text>

    <rect x="18" y="65" width="244" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="28" y="86" fill="#cbd5e1" font-family="sans-serif" font-size="11">Listening for Master advertisements</text>

    <rect x="18" y="106" width="244" height="30" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="28" y="125" fill="#f59e0b" font-family="monospace" font-size="10">Auto-Promotes if Master misses 3 pings</text>
  </g>

  <!-- Heartbeat Arrow between Master & Backup -->
  <path d="M 360 215 L 432 215" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan6)" />
  <text x="400" y="205" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">VRRP 1s</text>

  <!-- Line connecting VIP to Master -->
  <path d="M 320 112 L 250 138" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen6)" />

  <!-- Legend -->
  <g transform="translate(140, 318)">
    <circle cx="10" cy="10" r="5" fill="#34d399" />
    <text x="22" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Master currently serves all client traffic on VIP</text>

    <circle cx="340" cy="10" r="5" fill="#38bdf8" />
    <text x="352" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Heartbeat sync ensures zero-downtime failover</text>
  </g>
</svg>
