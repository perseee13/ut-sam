<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="lxdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glowOrange8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad8)" stroke="#1e293b" stroke-width="1.5" />

  <rect x="24" y="20" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="34" y="38" fill="#fdba74" font-family="monospace" font-size="11" font-weight="700">LXD SYSTEM CONTAINERS</text>
  <text x="254" y="38" fill="#64748b" font-family="sans-serif" font-size="12">Full Linux OS Instances · Bare-Metal Speed · systemd</text>

  <!-- Main Linux Host Container -->
  <g transform="translate(30, 65)">
    <rect width="740" height="245" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <text x="20" y="26" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">🐧 Bare-Metal Linux Host (Shared Kernel)</text>
    <text x="510" y="26" fill="#f97316" font-family="monospace" font-size="11">ZFS / btrfs Instant Snapshots</text>

    <!-- LXD Daemon -->
    <rect x="20" y="42" width="215" height="185" rx="10" fill="url(#lxdGrad)" stroke="#f97316" stroke-width="1.5" filter="url(#glowOrange8)" />
    <text x="35" y="70" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">🐧 LXD Daemon</text>
    <text x="35" y="88" fill="#ffedd5" font-family="monospace" font-size="11">lxc CLI &amp; REST Socket API</text>

    <rect x="35" y="105" width="185" height="32" rx="6" fill="#7c2d12" />
    <text x="45" y="125" fill="#fed7aa" font-family="monospace" font-size="10">Bridge Network: lxdbr0</text>

    <rect x="35" y="145" width="185" height="32" rx="6" fill="#7c2d12" />
    <text x="45" y="165" fill="#fed7aa" font-family="monospace" font-size="10">SubUID/GID Namespaces</text>

    <rect x="35" y="185" width="185" height="30" rx="6" fill="#7c2d12" />
    <text x="45" y="204" fill="#ffedd5" font-family="sans-serif" font-size="10" font-weight="600">Hardware Access: direct passthru</text>

    <!-- System Container 1: Full Ubuntu -->
    <g transform="translate(260, 42)">
      <rect width="145" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#ea580c" fill-opacity="0.25" />
      <text x="27" y="34" fill="#fb923c" font-size="16" text-anchor="middle">📦</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">ubuntu-srv</text>
      <text x="50" y="42" fill="#fb923c" font-family="monospace" font-size="10">ubuntu:24.04</text>

      <rect x="12" y="60" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">PID 1: /sbin/init</text>

      <rect x="12" y="98" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">SSH + ufw firewall</text>

      <rect x="12" y="136" width="121" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">ZFS Snapshot</text>
      <text x="18" y="165" fill="#4ade80" font-family="monospace" font-size="9">snap0 (1.2s)</text>
    </g>

    <!-- System Container 2: Full Debian -->
    <g transform="translate(420, 42)">
      <rect width="145" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#e11d48" fill-opacity="0.25" />
      <text x="27" y="34" fill="#fb7185" font-size="16" text-anchor="middle">🐧</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">debian-node</text>
      <text x="50" y="42" fill="#fb7185" font-family="monospace" font-size="10">debian:12-bookworm</text>

      <rect x="12" y="60" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">Full systemd OS</text>

      <rect x="12" y="98" width="121" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">cron + syslog</text>

      <rect x="12" y="136" width="121" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">Dedicated IP</text>
      <text x="18" y="165" fill="#38bdf8" font-family="monospace" font-size="9">10.150.80.42</text>
    </g>

    <!-- System Container 3: Full Alpine -->
    <g transform="translate(580, 42)">
      <rect width="140" height="185" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="12" y="14" width="30" height="30" rx="6" fill="#0ea5e9" fill-opacity="0.25" />
      <text x="27" y="34" fill="#38bdf8" font-size="16" text-anchor="middle">🏔️</text>
      <text x="50" y="28" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">alpine-box</text>
      <text x="50" y="42" fill="#38bdf8" font-family="monospace" font-size="10">alpine:3.20</text>

      <rect x="12" y="60" width="116" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="79" fill="#94a3b8" font-family="monospace" font-size="10">OpenRC init</text>

      <rect x="12" y="98" width="116" height="30" rx="5" fill="#0f172a" />
      <text x="18" y="117" fill="#38bdf8" font-family="monospace" font-size="10">RAM: ~28 MB</text>

      <rect x="12" y="136" width="116" height="38" rx="5" fill="#0f172a" />
      <text x="18" y="152" fill="#cbd5e1" font-family="sans-serif" font-size="9">Boot Time</text>
      <text x="18" y="165" fill="#4ade80" font-family="monospace" font-size="9">&lt; 0.5 sec</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(140, 325)">
    <circle cx="10" cy="10" r="5" fill="#f97316" />
    <text x="22" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Each container runs a full Linux OS with system services</text>

    <circle cx="390" cy="10" r="5" fill="#38bdf8" />
    <text x="402" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Zero hypervisor overhead compared to heavy Virtual Machines</text>
  </g>
</svg>
