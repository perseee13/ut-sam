<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="squidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Grid pattern overlay -->
  <g opacity="0.06">
    <path d="M 0,60 L 800,60 M 0,120 L 800,120 M 0,180 L 800,180 M 0,240 L 800,240 M 0,300 L 800,300" stroke="#fff" stroke-dasharray="4,4" />
    <path d="M 160,0 L 160,360 M 320,0 L 320,360 M 480,0 L 480,360 M 640,0 L 640,360" stroke="#fff" stroke-dasharray="4,4" />
  </g>

  <!-- Title Badge -->
  <rect x="24" y="20" width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="34" y="38" fill="#5eead4" font-family="monospace" font-size="11" font-weight="700">FORWARD PROXY ARCHITECTURE</text>
  <text x="214" y="38" fill="#64748b" font-family="sans-serif" font-size="12">Port 3128 · LAN Web Caching</text>

  <!-- Node 1: Client LAN -->
  <g transform="translate(40, 90)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2" />
    <text x="34" y="40" fill="#60a5fa" font-size="20" text-anchor="middle">💻</text>
    <text x="62" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Client Devices</text>
    <text x="62" y="48" fill="#94a3b8" font-family="monospace" font-size="11">192.168.1.0/24</text>
    
    <rect x="16" y="70" width="148" height="32" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="90" fill="#cbd5e1" font-family="monospace" font-size="11">export http_proxy</text>

    <rect x="16" y="112" width="148" height="52" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Browser Proxy Settings:</text>
    <text x="26" y="148" fill="#38bdf8" font-family="monospace" font-size="11">192.168.1.10:3128</text>
  </g>

  <!-- Node 2: Squid Forward Proxy (Center) -->
  <g transform="translate(300, 75)" filter="url(#glowTeal)">
    <rect width="200" height="220" rx="14" fill="url(#squidGrad)" stroke="#14b8a6" stroke-width="2" />
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#14b8a6" fill-opacity="0.25" />
    <text x="36" y="43" fill="#2dd4bf" font-size="22" text-anchor="middle">🦑</text>
    <text x="66" y="32" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">Squid Proxy</text>
    <text x="66" y="48" fill="#5eead4" font-family="monospace" font-size="12">Port 3128 TCP</text>

    <!-- Sub-components inside Squid -->
    <rect x="16" y="72" width="168" height="34" rx="6" fill="#042f2e" stroke="#0d9488" stroke-width="1" />
    <text x="26" y="93" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="600">🛡️ ACL Verification</text>

    <rect x="16" y="116" width="168" height="34" rx="6" fill="#042f2e" stroke="#0d9488" stroke-width="1" />
    <text x="26" y="137" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="600">⚡ Memory Cache (RAM)</text>

    <rect x="16" y="160" width="168" height="42" rx="6" fill="#042f2e" stroke="#0d9488" stroke-width="1" />
    <text x="26" y="178" fill="#99f6e4" font-family="sans-serif" font-size="11" font-weight="600">💾 Disk Cache Storage</text>
    <text x="26" y="193" fill="#5eead4" font-family="monospace" font-size="10">/var/spool/squid (UFS)</text>
  </g>

  <!-- Node 3: Internet & Origin Servers -->
  <g transform="translate(580, 90)">
    <rect width="180" height="190" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
    <text x="34" y="40" fill="#34d399" font-size="20" text-anchor="middle">🌐</text>
    <text x="62" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Origin Web</text>
    <text x="62" y="48" fill="#94a3b8" font-family="monospace" font-size="11">Public Internet</text>
    
    <rect x="16" y="70" width="148" height="32" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="90" fill="#a7f3d0" font-family="monospace" font-size="11">example.com:80</text>

    <rect x="16" y="112" width="148" height="52" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">Bandwidth Savings:</text>
    <text x="26" y="148" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">HIT = 0 KB Ext WAN</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- Client -> Squid (Request) -->
  <path d="M 220 160 L 292 160" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="228" y="138" width="60" height="18" rx="4" fill="#0f172a" stroke="#2dd4bf" stroke-width="0.8" />
  <text x="258" y="151" fill="#5eead4" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">1. HTTP REQ</text>

  <!-- Squid -> Client (Cached HIT response) -->
  <path d="M 292 205 L 228 205" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowAmber)" />
  <text x="260" y="222" fill="#f59e0b" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">CACHE HIT</text>

  <!-- Squid -> Web (Cache Miss fetch) -->
  <path d="M 500 160 L 572 160" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="508" y="138" width="60" height="18" rx="4" fill="#0f172a" stroke="#2dd4bf" stroke-width="0.8" />
  <text x="538" y="151" fill="#5eead4" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">2. CACHE MISS</text>

  <!-- Web -> Squid (Fetch response & cache) -->
  <path d="M 572 205 L 508 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="540" y="222" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">3. STORE CACHE</text>

  <!-- Bottom Legend -->
  <g transform="translate(140, 320)">
    <circle cx="10" cy="10" r="5" fill="#2dd4bf" />
    <text x="22" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Request Packet</text>

    <circle cx="150" cy="10" r="5" fill="#f59e0b" />
    <text x="162" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Cache Hit (Fast response from disk)</text>

    <circle cx="430" cy="10" r="5" fill="#38bdf8" />
    <text x="442" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Cache Miss (Fetched from origin &amp; saved)</text>
  </g>
</svg>
