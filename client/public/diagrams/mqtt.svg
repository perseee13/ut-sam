<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="mqttGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <filter id="glowPink7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
    <marker id="arrowTeal7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <rect width="800" height="360" rx="16" fill="url(#bgGrad7)" stroke="#1e293b" stroke-width="1.5" />

  <rect x="24" y="20" width="220" height="28" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="34" y="38" fill="#fda4af" font-family="monospace" font-size="11" font-weight="700">MQTT BROKER ARCHITECTURE</text>
  <text x="254" y="38" fill="#64748b" font-family="sans-serif" font-size="12">Publish / Subscribe Pattern · IoT Telemetry</text>

  <!-- Left: Publishers (IoT Devices) -->
  <g transform="translate(40, 90)">
    <rect width="180" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#f43f5e" fill-opacity="0.2" />
    <text x="34" y="40" fill="#fb7185" font-size="20" text-anchor="middle">📡</text>
    <text x="62" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Publishers</text>
    <text x="62" y="48" fill="#94a3b8" font-family="monospace" font-size="11">Sensors &amp; Devices</text>

    <rect x="16" y="70" width="148" height="42" rx="6" fill="#1e293b" />
    <text x="24" y="87" fill="#cbd5e1" font-family="sans-serif" font-size="10">Temp Sensor 01:</text>
    <text x="24" y="103" fill="#fb7185" font-family="monospace" font-size="10">topic: lab/temp = "23.4"</text>

    <rect x="16" y="122" width="148" height="42" rx="6" fill="#1e293b" />
    <text x="24" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="10">Power Meter 02:</text>
    <text x="24" y="155" fill="#fb7185" font-family="monospace" font-size="10">topic: lab/power = "420W"</text>
  </g>

  <!-- Middle: Mosquitto Message Broker -->
  <g transform="translate(295, 75)" filter="url(#glowPink7)">
    <rect width="210" height="220" rx="14" fill="url(#mqttGrad)" stroke="#f43f5e" stroke-width="2" />
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#be123c" />
    <text x="36" y="43" fill="#fff" font-size="22" text-anchor="middle">⚡</text>
    <text x="66" y="32" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">Mosquitto Broker</text>
    <text x="66" y="48" fill="#fecdd3" font-family="monospace" font-size="12">Port 1883 / 8883 (TLS)</text>

    <rect x="16" y="72" width="178" height="34" rx="6" fill="#500724" stroke="#9d174d" />
    <text x="26" y="93" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="600">🎯 Topic Filter &amp; Trie Routing</text>

    <rect x="16" y="116" width="178" height="34" rx="6" fill="#500724" stroke="#9d174d" />
    <text x="26" y="137" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="600">🔒 Password Authentication</text>

    <rect x="16" y="160" width="178" height="42" rx="6" fill="#500724" stroke="#9d174d" />
    <text x="26" y="178" fill="#fff" font-family="sans-serif" font-size="11" font-weight="600">💾 Retained Messages &amp; QoS</text>
    <text x="26" y="193" fill="#fecdd3" font-family="monospace" font-size="10">Zero database dependency</text>
  </g>

  <!-- Right: Subscribers -->
  <g transform="translate(580, 90)">
    <rect width="180" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0d9488" fill-opacity="0.2" />
    <text x="34" y="40" fill="#2dd4bf" font-size="20" text-anchor="middle">📱</text>
    <text x="62" y="32" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Subscribers</text>
    <text x="62" y="48" fill="#94a3b8" font-family="monospace" font-size="11">Clients &amp; Apps</text>

    <rect x="16" y="70" width="148" height="42" rx="6" fill="#1e293b" />
    <text x="24" y="87" fill="#cbd5e1" font-family="sans-serif" font-size="10">Web Dashboard:</text>
    <text x="24" y="103" fill="#2dd4bf" font-family="monospace" font-size="10">sub: lab/# (All topics)</text>

    <rect x="16" y="122" width="148" height="42" rx="6" fill="#1e293b" />
    <text x="24" y="139" fill="#cbd5e1" font-family="sans-serif" font-size="10">Alert Bot:</text>
    <text x="24" y="155" fill="#2dd4bf" font-family="monospace" font-size="10">sub: lab/alerts</text>
  </g>

  <!-- Connectors -->
  <path d="M 220 160 L 287 160" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrowRose)" />
  <rect x="226" y="138" width="60" height="18" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="0.8" />
  <text x="256" y="151" fill="#fecdd3" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">PUBLISH</text>

  <path d="M 505 160 L 572 160" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrowTeal7)" />
  <rect x="512" y="138" width="60" height="18" rx="4" fill="#0f172a" stroke="#2dd4bf" stroke-width="0.8" />
  <text x="542" y="151" fill="#99f6e4" font-family="monospace" font-size="9" text-anchor="middle" font-weight="700">DELIVER</text>

  <!-- Legend -->
  <g transform="translate(140, 320)">
    <circle cx="10" cy="10" r="5" fill="#fb7185" />
    <text x="22" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Publishers push messages to specific topics</text>

    <circle cx="340" cy="10" r="5" fill="#2dd4bf" />
    <text x="352" y="13" fill="#cbd5e1" font-family="sans-serif" font-size="11">Subscribers receive instant updates via persistent TCP</text>
  </g>
</svg>
