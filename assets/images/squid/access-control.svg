<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2140"/>
      <stop offset="100%" stop-color="#1a2a44"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bg-block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)" rx="16"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="70" r="50" fill="#1e3a5f" opacity="0.4"/>
  <circle cx="40" cy="350" r="40" fill="#1e3a5f" opacity="0.4"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#93c5fd" letter-spacing="1">How Access Control Works</text>

  <!-- LAN/Internet (allowed) -->
  <g transform="translate(60, 110)">
    <rect x="-80" y="-30" width="160" height="60" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#14532d">🌐 LAN</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">allowed</text>
    <!-- User -->
    <circle cx="0" cy="40" r="12" fill="#38bdf8" opacity="0.8"/>
    <text x="0" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0c4a6e" font-weight="bold">👤</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">User 1</text>
  </g>

  <!-- Arrow to Squid -->
  <path d="M100,140 L170,140" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow1)"/>
  <polygon points="166,134 182,140 166,146" fill="#93c5fd" stroke="none"/>

  <!-- Squid Proxy Server with shield -->
  <g transform="translate(240, 90)">
    <!-- Shield (ACL) -->
    <path d="M0,-40 L40,0 L0,40 L-40,0 Z" fill="url(#shield)" stroke="#5b21b6" stroke-width="2" rx="8"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">🔒</text>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#c4b5fd">ACL</text>
    <!-- Server body -->
    <rect x="-35" y="10" width="70" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="-28" y="16" width="56" height="10" rx="4" fill="#0f172a"/>
    <text x="0" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Squid</text>
    <text x="0" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#94a3b8">checks rules</text>
  </g>

  <!-- Arrow to Internet (allowed) -->
  <path d="M270,130 L330,130" fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow2)"/>
  <polygon points="326,124 340,130 326,136" fill="#93c5fd" stroke="none"/>

  <!-- Internet/Destination -->
  <g transform="translate(380, 130)">
    <rect x="-60" y="-25" width="120" height="50" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1e40af">🌍 Website</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">can reach</text>
  </g>

  <!-- Blocked user -->
  <g transform="translate(50, 300)">
    <rect x="-60" y="-20" width="120" height="40" rx="8" fill="url(#bg-block)" stroke="#b91c1c" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#7f1d1d">⛔ Blocked</text>
    <circle cx="0" cy="35" r="9" fill="#fca5a5" opacity="0.7"/>
    <text x="0" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b" font-weight="bold">🔴</text>
    <text x="0" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">no internet</text>
  </g>

  <!-- Arrow from Squid to blocked user -->
  <path d="M270,210 L250,280" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow3)"/>
  <polygon points="246,274 258,280 246,286" fill="#fca5a5" stroke="none"/>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#93c5fd"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#3b82f6"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#fca5a5"/>
    </marker>
  </defs>
</svg>
